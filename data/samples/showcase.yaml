# Showcase corpus for the "try an example" panel.
# Demo inputs only — no expected verdicts or compliance labels are included here.
# Ground truth is hand-authored separately.

- id: hype-get-rich
  medium: social_post
  text: |-
    🚀🚀 Turn €500 into €5,000 in a WEEK with Vantora Markets CFDs! Our traders are CRUSHING it every single day 💰💰 No losses, just pure profit potential. Sign up NOW and claim your welcome bonus before it's gone! 🔥🔥
  note: Emoji-heavy hype with an implied guaranteed return and zero risk warning of any kind.

- id: urgency-flash-sale
  medium: push_notification
  text: |-
    ⏰ LAST CHANCE! Only 2 hours left to unlock 0% commission trading on Vantora Markets. Thousands of traders are already in — don't get left behind. Tap now before this deal disappears forever!
  note: Countdown-driven urgency and scarcity pressure with no mention of risk at all.

- id: guaranteed-returns-landing
  medium: landing_page
  text: |-
    Vantora Markets: Where Winning Is Guaranteed

    Join the platform built for consistent profits. Our proprietary Smart Trade signals have delivered winning trades for 94% of our clients last quarter. Copy our top performers automatically and watch your balance grow, week after week, with virtually no effort on your part. Open an account today and start banking guaranteed gains.
  note: Explicit "guaranteed" profit claim backed by a fabricated win-rate stat, with no risk disclosure anywhere on the page.

- id: no-warning-affiliate
  medium: affiliate_banner
  text: |-
    Vantora Markets pays the highest CFD leverage in the market — trade with up to 1:500 and multiply your gains instantly. Click through now and start trading bigger, faster, better.
  note: Promotes maximum leverage as pure upside with no risk warning or balancing disclosure anywhere in the banner.

- id: buried-warning-throwaway
  medium: email
  text: |-
    Subject: Your Q3 Trading Bonus Is Here 🎉

    Hi Alex, we've unlocked new trading tools for you: tighter spreads, faster execution, and a dedicated account manager. Log in and explore your upgraded dashboard today.

    Happy trading,
    The Vantora Team

    P.S. CFDs are complex instruments and come with a high risk of losing money rapidly due to leverage. 76% of retail investor accounts lose money when trading CFDs with this provider. You should consider whether you understand how CFDs work and whether you can afford to take the high risk of losing your money.
  note: The full mandated warning is technically present but demoted to a P.S. after the sign-off, beneath prominent bonus-focused copy.

- id: wrong-variant-mismatch
  medium: landing_page
  text: |-
    Vantora Markets gives you direct access to global CFD markets with tight spreads and fast execution. CFDs are complex instruments that carry risk due to leverage, and most retail accounts can lose money when trading CFDs with us. Please consider your risk tolerance carefully before you start trading.
  note: A softened paraphrase stands in for the risk statement instead of either approved CySEC wording, so an exact-match check would flag it as missing.

- id: benefits-overshadow-warning
  medium: landing_page
  text: |-
    Vantora Markets Pro Account

    ✔ Zero commission on 200+ CFD instruments
    ✔ Lightning-fast execution under 30ms
    ✔ Free access to premium market signals
