  note: Seven prominent benefit bullets dominate the page while the correctly worded warning appears just once, in plain text, at the very bottom.

- id: missing-loss-percentage
  medium: social_post
  text: |-
    CFDs are complex instruments and come with a high risk of losing money rapidly due to leverage. % of retail investor accounts lose money when trading CFDs with this provider. You should consider whether you understand how CFDs work and whether you can afford to take the high risk of losing your money. Trade smarter with Vantora Markets.
  note: Uses the percentage-variant sentence structure but the actual loss figure was left blank, producing a broken rather than compliant warning.

