- id: compliant-email-newsletter
  medium: email
  text: |-
    Subject: Your Monthly Market Update from Vantora Markets

    This month we cover interest rate expectations, upcoming earnings for major indices, and how leverage affects your margin requirements. Read the full breakdown on our research page.

    CFDs are complex instruments and come with a high risk of losing money rapidly due to leverage. 74% of retail investor accounts lose money when trading CFDs with this provider. You should consider whether you understand how CFDs work and whether you can afford to take the high risk of losing your money.
  note: Informational newsletter tone with the percentage-variant warning presented at normal size directly beneath the content it qualifies.

- id: compliant-affiliate-banner
  medium: affiliate_banner
  text: |-
    Vantora Markets: regulated CFD trading on 300+ global markets. CFDs are complex instruments and come with a high risk of losing money rapidly due to leverage. 71% of retail investor accounts lose money when trading CFDs with this provider. You should consider whether you understand how CFDs work and whether you can afford to take the high risk of losing your money.
