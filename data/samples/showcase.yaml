- id: deposit-bonus-offer
  medium: push_notification
  text: |-
    Deposit €1,000 or more this week and Vantora Markets will add a 20% bonus straight to your trading account. More funds, more opportunities — top up now and claim yours before Friday.
  note: A percentage-of-deposit match is a textbook trading inducement of the kind CySEC prohibits for retail clients.

- id: cash-rebate-volume
  medium: email
  text: |-
    Subject: Get Cash Back on Every Trade

    Hi there, starting this month Vantora Markets is rewarding active traders with a cash rebate: trade 10 standard lots in a calendar month and we'll credit €100 directly to your account balance. The more you trade, the more you earn back. Terms apply.
  note: A lots-traded-for-cash structure is a volume-based inducement rather than a cost adjustment, placing it squarely in prohibited territory.

- id: referral-friend-bonus
  medium: social_post
  text: |-
    Refer a friend to Vantora Markets and you BOTH get a €50 trading credit once they fund their account 🤝 Unlimited referrals, unlimited bonuses. Share your link today and start stacking rewards!
  note: A refer-a-friend cash credit is a distinct inducement pattern worth testing alongside the deposit-match and volume-rebate examples.

- id: tiered-spread-discount
  medium: landing_page
  text: |-
    Vantora Markets applies volume-based spread pricing across all account tiers. Standard accounts trade major FX pairs from 1.2 pips; Active tier (10+ lots/month) drops to 0.9 pips; Professional tier (50+ lots/month) reaches 0.6 pips. Spreads are reviewed monthly and published transparently on our pricing page.
  note: A published, volume-tiered spread schedule is a cost-structure adjustment rather than a cash inducement, so it should NOT trip a violation despite resembling "reward for trading more."

- id: commission-tier-table
  medium: email
  text: |-
    Subject: Updated Commission Tiers — Effective August 1

    Your account tier is reviewed automatically each quarter based on trading volume. From August 1, clients trading 20+ lots per month move to our Silver tier (commission drops from $7 to $5 per lot), and 100+ lots per month qualifies for Gold tier ($3.50 per lot). No action is needed on your part.
  note: A formulaic commission-per-lot discount tied to volume — the kind of structural pricing tier explicitly distinguished from prohibited trading inducements.

- id: internal-ops-status
  medium: internal_note
  text: |-
    Heads up team — the margin-call notification service had a 40-minute outage between 14:10 and 14:50 UTC today due to a queue backlog after the pricing-feed failover. All affected clients were re-notified retroactively once the queue drained. No trades were auto-liquidated during the gap. Postmortem doc going out tomorrow.
  note: Purely internal engineering/ops update with no client-facing claims — probes whether the input gate correctly skips compliance scoring for non-marketing text.

- id: margin-call-client-notice
  medium: client_notice
  text: |-
    Your account (ending 4821) fell below the 50% margin level at 09:32 UTC on positions in DE40 and EUR/USD. To avoid automatic position closure, please deposit additional funds or reduce your open exposure. Current equity: €3,420. Required margin: €6,900. This notice is for information only.
  note: A factual, individually-addressed operational notice to an existing client — tests that the gate distinguishes genuine account communications from marketing copy.
