[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "complai"
version = "0.1.0"
description = "Regulation compliance agent: decomposes regulation PDFs into checkable rules and checks marketing copy against them."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "streamlit>=1.40",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
